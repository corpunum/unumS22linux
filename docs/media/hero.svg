<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>unumS22linux: a Galaxy S22 boots its own Linux from the recovery partition, with no Android services, up to a touch desktop with local models and an AI agent</title>
  <style>
    .h { font-size: 12px; font-weight: 800; letter-spacing: .12em; fill: #93a1bd; }
    .t { font-size: 15px; fill: #e8edf7; font-weight: 600; }
    .s { font-size: 11.5px; fill: #93a1bd; }
    /* 12 s loop: the boot chain lights up step by step, the phone screen follows */
    .k1 { animation: k1 12s infinite; } .k2 { animation: k2 12s infinite; } .k3 { animation: k3 12s infinite; }
    .k4 { animation: k4 12s infinite; } .k5 { animation: k5 12s infinite; } .k6 { animation: k6 12s infinite; }
    @keyframes k1 { 0%,2% { opacity: .18 } 4%,95% { opacity: 1 } 99%,100% { opacity: .18 } }
    @keyframes k2 { 0%,12% { opacity: .18 } 14%,95% { opacity: 1 } 99%,100% { opacity: .18 } }
    @keyframes k3 { 0%,24% { opacity: .18 } 26%,95% { opacity: 1 } 99%,100% { opacity: .18 } }
    @keyframes k4 { 0%,36% { opacity: .18 } 38%,95% { opacity: 1 } 99%,100% { opacity: .18 } }
    @keyframes k5 { 0%,48% { opacity: .18 } 50%,95% { opacity: 1 } 99%,100% { opacity: .18 } }
    @keyframes k6 { 0%,60% { opacity: .18 } 62%,95% { opacity: 1 } 99%,100% { opacity: .18 } }
    .sc1 { animation: sc1 12s infinite; } .sc2 { animation: sc2 12s infinite; } .sc3 { animation: sc3 12s infinite; }
    @keyframes sc1 { 0%,22% { opacity: 1 } 24%,100% { opacity: 0 } }
    @keyframes sc2 { 0%,22% { opacity: 0 } 24%,58% { opacity: 1 } 60%,100% { opacity: 0 } }
    @keyframes sc3 { 0%,58% { opacity: 0 } 60%,95% { opacity: 1 } 99%,100% { opacity: 0 } }
    .cur { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0 } }
  </style>
  <rect width="900" height="400" rx="18" fill="#0b1020"/>

  <!-- the phone -->
  <rect x="56" y="34" width="176" height="336" rx="26" fill="#1c2540" stroke="#3a4a78" stroke-width="3"/>
  <rect x="68" y="50" width="152" height="304" rx="14" fill="#05070f"/>
  <circle cx="144" cy="60" r="3.5" fill="#3a4a78"/>
  <!-- screen 1: Samsung boot -->
  <g class="sc1">
    <text x="144" y="196" text-anchor="middle" font-size="15" font-weight="800" fill="#e8edf7" letter-spacing=".1em">SAMSUNG</text>
    <text x="144" y="216" text-anchor="middle" class="s">Galaxy S22 · Exynos 2200</text>
  </g>
  <!-- screen 2: native Linux console -->
  <g class="sc2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.6" fill="#30a46c">
    <text x="76" y="80">[ ok ] guardian PID 1</text>
    <text x="76" y="96">[ ok ] no Android services</text>
    <text x="76" y="112">[ ok ] Alpine Linux arm64</text>
    <text x="76" y="128">[ ok ] wlan0 up, tailscale</text>
    <text x="76" y="144">[ ok ] Arch Linux ARM</text>
    <text x="76" y="160">[ ok ] llama-server :8090</text>
    <text x="76" y="176">[ ok ] openunum :18880</text>
    <text x="76" y="192" fill="#e8edf7">root@s22:~#<tspan class="cur"> ▌</tspan></text>
  </g>
  <!-- screen 3: touch UI -->
  <g class="sc3">
    <text x="80" y="82" font-size="20" font-weight="800" fill="#e8edf7">11:20</text>
    <rect x="78" y="96" width="64" height="30" rx="6" fill="#151d33"/><text x="84" y="108" font-size="7" fill="#f5c542">● Agent model</text><text x="84" y="119" font-size="7.5" fill="#e8edf7">gpt-6-luna</text>
    <rect x="146" y="96" width="64" height="30" rx="6" fill="#151d33"/><text x="152" y="108" font-size="7" fill="#93a1bd">Sessions</text><text x="152" y="119" font-size="7.5" fill="#e8edf7">0 active</text>
    <rect x="78" y="134" width="64" height="62" rx="8" fill="#151d33"/><text x="86" y="186" font-size="9" font-weight="700" fill="#e8edf7">Agent chat</text><circle cx="90" cy="150" r="5" fill="#3e63dd"/>
    <rect x="146" y="134" width="64" height="62" rx="8" fill="#151d33"/><text x="154" y="186" font-size="9" font-weight="700" fill="#e8edf7">Phone</text><circle cx="158" cy="150" r="5" fill="#30a46c"/>
    <rect x="78" y="202" width="64" height="62" rx="8" fill="#151d33"/><text x="86" y="254" font-size="9" font-weight="700" fill="#e8edf7">Camera</text><circle cx="90" cy="218" r="5" fill="#f5c542"/>
    <rect x="146" y="202" width="64" height="62" rx="8" fill="#151d33"/><text x="154" y="254" font-size="9" font-weight="700" fill="#e8edf7">Files</text><circle cx="158" cy="218" r="5" fill="#c9a26b"/>
    <rect x="78" y="270" width="64" height="62" rx="8" fill="#151d33"/><text x="86" y="322" font-size="9" font-weight="700" fill="#e8edf7">Terminal</text>
    <rect x="146" y="270" width="64" height="62" rx="8" fill="#151d33"/><text x="154" y="322" font-size="9" font-weight="700" fill="#e8edf7">Settings</text>
  </g>

  <!-- the boot chain -->
  <text x="290" y="54" class="h">WHAT HAPPENS WHEN IT POWERS ON</text>
  <line x1="300" y1="94" x2="300" y2="322" stroke="#2c3a62" stroke-width="2" stroke-dasharray="3 4"/>
  <g class="k1"><circle cx="300" cy="86" r="8" fill="#93a1bd"/><text x="320" y="91" class="t">Samsung bootloader (unlocked)</text></g>
  <g class="k2"><circle cx="300" cy="130" r="8" fill="#3e63dd"/><text x="320" y="128" class="t">RECOVERY partition: our kernel + our /init</text><text x="320" y="146" class="s">the normal Android boot is never started</text></g>
  <g class="k3"><circle cx="300" cy="180" r="8" fill="#3e63dd"/><text x="320" y="178" class="t">a small "guardian" becomes PID 1</text><text x="320" y="196" class="s">no Android services, Android recovery kept for rescue</text></g>
  <g class="k4"><circle cx="300" cy="230" r="8" fill="#30a46c"/><text x="320" y="228" class="t">Alpine + Arch Linux ARM, Wi-Fi, Tailscale</text><text x="320" y="246" class="s">persistent on internal storage, survives reboots</text></g>
  <g class="k5"><circle cx="300" cy="280" r="8" fill="#30a46c"/><text x="320" y="278" class="t">Rust touch shell, local AI on GPU + NPU</text><text x="320" y="296" class="s">tap to page ~9 ms; speaks English and Greek</text></g>
  <g class="k6"><circle cx="300" cy="330" r="8" fill="#f5c542"/><text x="320" y="328" class="t">OpenUnum agent running on the phone</text><text x="320" y="346" class="s">chat, voice, SMS, 5G data, camera, tools</text></g>
</svg>
