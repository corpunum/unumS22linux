[package]
name = "s22d"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
description = "Local JSON device daemon for the Galaxy S22 native Linux phone"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
