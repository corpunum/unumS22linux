# ALSA config for the S22 native tools (ALSA_CONFIG_PATH=/opt/s22-audio/mixer/alsa-s22.conf).
# The hardware-direct RDMA6 accepts any rate/channel count, but its ASRC path
# garbles non-48k mono input, so always convert to 48 kHz stereo in software.
</usr/share/alsa/alsa.conf>
pcm.s22spk {
    type plug
    slave { pcm "hw:0,6" rate 48000 channels 2 format S16_LE }
}

# Offline converter for the firmware-graph frontends (2026-10-21 fix):
#   aplay -D s22conv:/tmp/out.raw in.wav   ->  48 kHz stereo S16_LE raw file
# The calliope_N frontends must never sit behind a plug: alsa-lib's rate/linear
# plugins drive their slave with MMAP access, and the ABOX vdma mmap of an ION
# buffer (dma_buf_mmap replaces the vm_ops) leaks substream->mmap_count, so
# every later HW_PARAMS on that frontend fails with EBADFD until reboot.
# s22-say converts here (null slave: no real time, ~20 ms per 5 s), then writes
# the raw stream to hw:0,100 with plain RW access.
pcm.s22conv {
    @args [ FILE ]
    @args.FILE { type string }
    type plug
    slave {
        pcm { type file; slave.pcm "null"; file $FILE; format "raw" }
        rate 48000
        channels 2
        format S16_LE
    }
}
