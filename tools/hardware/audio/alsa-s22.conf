# ALSA config for the S22 native tools (ALSA_CONFIG_PATH=/opt/s22-audio/mixer/alsa-s22.conf).
# The hardware-direct RDMA6 accepts any rate/channel count, but its ASRC path
# garbles non-48k mono input, so always convert to 48 kHz stereo in software.
</usr/share/alsa/alsa.conf>
pcm.s22spk {
    type plug
    slave { pcm "hw:0,6" rate 48000 channels 2 format S16_LE }
}

# Firmware-graph frontend (stock AudioProxy playback device 102 = calliope_2):
# calliope_2 -> VPCMOUT_DAI2 -> VDSP3 (rdma2-[sbll-]vpcmout) -> RDMA2 -> SPUS.
pcm.s22graph {
    type plug
    slave { pcm "hw:0,102" rate 48000 channels 2 format S16_LE }
}
