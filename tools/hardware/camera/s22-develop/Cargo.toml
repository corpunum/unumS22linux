[package]
name = "s22-develop"
version = "0.1.0"
edition = "2021"
description = "S22 raw Bayer -> processed photo (black level, defect fix, AWB, demosaic, CCM, tone, JPEG/PNG)"
license = "Apache-2.0"

[dependencies]
png = "0.17"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
