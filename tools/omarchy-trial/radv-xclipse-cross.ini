[binaries]
c = '/tmp/radv-clang-musl'
cpp = '/tmp/radv-clangxx-musl'
ar = '/usr/bin/llvm-ar'
ranlib = '/usr/bin/llvm-ranlib'
strip = '/usr/bin/llvm-strip'
pkg-config = '/tmp/radv-pkg-config-wrapper'
llvm-config = '/tmp/radv-llvm-config-wrapper'
glslangValidator = '/tmp/radv-host-deps/glslangValidator'
python = '/usr/bin/python3'

[properties]
needs_exe_wrapper = true

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'

[built-in options]
c_args = ['--target=aarch64-linux-musl', '--sysroot=/home/corpunum/s22-linux/rootfs/radv-xclipse-sysroot', '-nostdinc', '-isystem', '/home/corpunum/s22-linux/rootfs/radv-xclipse-sysroot/usr/include', '-isystem', '/usr/lib/llvm-18/lib/clang/18/include']
cpp_args = ['--target=aarch64-linux-musl', '--sysroot=/home/corpunum/s22-linux/rootfs/radv-xclipse-sysroot', '-nostdinc', '-isystem', '/home/corpunum/s22-linux/rootfs/radv-xclipse-sysroot/usr/include', '-isystem', '/usr/lib/llvm-18/lib/clang/18/include']
c_link_args = ['--target=aarch64-linux-musl', '--sysroot=/home/corpunum/s22-linux/rootfs/radv-xclipse-sysroot', '-fuse-ld=lld', '-L/home/corpunum/s22-linux/rootfs/radv-xclipse-sysroot/usr/lib']
cpp_link_args = ['--target=aarch64-linux-musl', '--sysroot=/home/corpunum/s22-linux/rootfs/radv-xclipse-sysroot', '-fuse-ld=lld', '-L/home/corpunum/s22-linux/rootfs/radv-xclipse-sysroot/usr/lib']
