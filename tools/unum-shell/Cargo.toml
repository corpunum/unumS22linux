[package]
name = "unum-shell"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A lightweight iced touch shell for OpenUnum on the Galaxy S22"

[dependencies]
iced = { version = "=0.12.1", default-features = false, features = ["tokio", "image"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"

[dev-dependencies]
mockito = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
