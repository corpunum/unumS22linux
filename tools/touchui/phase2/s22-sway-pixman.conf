# sway on the S22 panel with the wlroots pixman (CPU) renderer.
# Installed at /root/s22-sway-pixman.conf in the Arch chroot. Started by
# p2-trial.sh (trial) or start-persistent-desktop with /etc/s22-desktop =
# sway-pixman. Env: WLR_RENDERER=pixman WLR_DRM_DEVICES=/dev/dri/card1.
# Phone layout: one fullscreen app at a time, no bar (the touch shell is the UI).
# The touch shell (quickshell /opt/s22-touch) is NOT started here: s22-touchd
# supervises it and finds this session through /run/s22-desktop/session.

xwayland disable
output DSI-1 mode 1080x2340@120Hz scale 2 position 0 0
default_border none
default_floating_border none
focus_follows_mouse no
seat * hide_cursor 1000
input type:touch map_to_output DSI-1
workspace_layout tabbed
for_window [app_id=".*"] border none

# Publish the session (socket name, sway IPC socket) for s22-touchd and the trial tooling.
exec sh -c 'mkdir -p /run/s22-desktop && printf "%s\n%s\n" "$WAYLAND_DISPLAY" "$SWAYSOCK" > /run/s22-desktop/session.tmp && mv /run/s22-desktop/session.tmp /run/s22-desktop/session'
exec foot --app-id=org.omarchy.agent pi
exec squeekboard

bindsym XF86AudioRaiseVolume nop
bindsym XF86AudioLowerVolume nop

# Curated hardware-keyboard bindings (off by default; `s22-kbd-bindings on` sets the flag).
exec_always sh -c '[ -f /root/.config/s22/omarchy-keyboard.enabled ] && s22-kbd-bindings on'
